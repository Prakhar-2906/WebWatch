<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebWatch Quick Add</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">WEBWATCH</p>
      <h1>Watch this page</h1>
      <p id="page-url" class="page-url">Checking the active tab…</p>
      <button id="send-page" type="button" disabled>Review in WebWatch</button>
      <button id="manage-pages" class="secondary" type="button">Manage monitored pages</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="help">WebWatch opens with the URL filled in. Review it and submit the form there to add the site.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
