services:
  - type: web
    name: webwatch-free-test
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python tools/install_playwright_browser.py
    startCommand: python -m gunicorn --config gunicorn.conf.py --bind 0.0.0.0:$PORT app:app
    autoDeployTrigger: 'off'
    envVars:
      - key: WEBWATCH_SECRET_KEY
        sync: false
      - key: WEBWATCH_OWNER_SETUP_TOKEN
        sync: false
      - key: WEBWATCH_DATABASE
        value: /tmp/webwatch.sqlite3
      - key: WEBWATCH_TRUST_PROXY
        value: "true"
      - key: WEBWATCH_DEMO_ACCOUNT
        sync: false
      - key: WEBWATCH_DEMO_EMAIL
        sync: false
      - key: WEBWATCH_DEMO_PASSWORD
        sync: false
